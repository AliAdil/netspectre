<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      background: #070a13;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      color: #00f3ff;
      letter-spacing: 0.5px;
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .desc {
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .status-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">NETSPECTRE</span>
    <span class="badge">ACTIVE</span>
  </div>
  <p class="desc">
    Browser Observability Extension is streaming HTTP metadata to your local desktop application.
  </p>
  <div class="status-box">
    Target: 127.0.0.1:48123<br>
    Status: Connected & Streaming<br>
    Credentials: Auto-Redacted
  </div>
</body>
</html>
